\* Bunshin queue/copy/verify protocol.
SPECIFICATION Spec

CONSTANT
    Files = {f1, f2}
    Jobs = {j1, j2}
    Hashes = {h1, h2}
    NULL = NULL
    jobFiles = [j1 |-> {f1}, j2 |-> {f1, f2}]

INVARIANT
    TypeOK
    DoneMeansMatch
    NoFalseOk
    VerdictOnlyAfterCopy

PROPERTY
    EventuallyTerminal
