name: Verify Bunshin

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: CLI integration (PowerShell 7)
        shell: pwsh
        run: ./test.ps1
      - name: CLI integration (Windows PowerShell 5.1)
        shell: powershell
        run: ./test.ps1
      - name: CLI stories
        shell: pwsh
        run: ./qa/Run-Stories.ps1
      - name: Copy engine regression tests
        run: dotnet run --project engine-tests --configuration Release
      - name: Protocol model
        shell: pwsh
        run: |
          python spec/check_model.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python spec/check_model.py --mutate
          exit $LASTEXITCODE
      - name: Build portable preview
        shell: pwsh
        run: ./Publish-Portable.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bunshin-win-x64-preview
          path: dist/*
          if-no-files-found: error
